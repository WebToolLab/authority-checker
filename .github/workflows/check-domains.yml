name: Check Domain Authority

on:
  workflow_dispatch:
    inputs:
      domains:
        description: 'Domains to check (space or comma separated)'
        required: true
        default: 'example.com'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - env:
          OPR_API_KEY: ${{ secrets.OPR_API_KEY }}
        run: |
          DOMAINS="${{ github.event.inputs.domains }}"
          DOMAINS="${DOMAINS//,/ }"
          python authority_checker.py $DOMAINS
